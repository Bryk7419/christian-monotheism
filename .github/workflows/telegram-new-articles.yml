# Анонс новых статей в Telegram-канале автора. Без секретов TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID ничего не отправляет.
name: Новые статьи в Telegram
on:
  push:
    branches: [main]
    paths: ['answers/**']
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Отправить анонсы
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 tools/notify_telegram.py
