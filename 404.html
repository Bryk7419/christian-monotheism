<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Страница не найдена — Бог один</title>
  <!-- GitHub Pages сохраняет запрошенный адрес любой глубины при показе 404. -->
  <base href="https://godisone.faith/">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <main id="main" class="main">
    <div class="search-page">
      <p>Бог один · 404</p>
      <h1 class="page-title">Страница не найдена</h1>
      <p>Проверьте адрес или поищите материал по названию, вопросу или месту Писания.</p>
      <form class="search-form search-form-page" action="search/index.html" method="get" role="search">
        <label class="search-label" for="search-q">Поиск по сайту</label>
        <div class="search-row">
          <input class="search-input" id="search-q" name="q" type="search" enterkeyhint="search" placeholder="Например: Ин. 8:58">
          <button class="button" type="submit">Найти</button>
        </div>
      </form>
      <p><a href="index.html">На главную</a></p>
    </div>
  </main>

</html>
